name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches plugin version
        run: |
          version=$(jq -r .version .claude-plugin/plugin.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match plugin.json version $version"
            exit 1
          fi

      - name: Test calculator
        run: python3 skills/heat-pump/scripts/heat_calc.py selftest

      - name: Build skill ZIP
        # ZIP holds the heat-pump/ folder, as Claude (desktop or web) expects for skill uploads
        run: cd skills && zip -r ../heat-pump.zip heat-pump -x "*/__pycache__/*"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" heat-pump.zip --verify-tag --generate-notes
